# Decision model: POST /v1/systemone (https://docs.baseten.co/inference/model-apis/decision-models)
# Images: image_url parts in a user message under state.messages (https://docs.baseten.co/reference/inference-api/system-one#image-inputs)
schema = 2
v2_only = true
base_model = "baseten/mammoth-1"

[api.systemone]
sdk = { aisdk = "@ai-sdk/typesafe-ai", opencodeai = "@opencode/ai/providers/typesafe-ai" }
compatibility = { image_input = "messages" }

[cost.text.input]
price = 0

[cost.text.output]
price = 0
